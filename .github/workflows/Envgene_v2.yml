name: "[IN DEV] EnvGene Execution v2"

run-name: "EnvGene Execution - ${{ inputs.ENV_NAMES }}"

permissions:
  contents: read

on:
  # Manual trigger only
  workflow_dispatch:
    inputs:
      ENV_NAMES:
        required: true
        type: string
        description: ""
      DEPLOYMENT_TICKET_ID:
        required: false
        default: ""
        type: string
        description: ""
      ENV_TEMPLATE_VERSION:
        required: false
        default: ""
        type: string
        description: ""
      ENV_BUILDER:
        required: false
        default: "true"
        type: choice
        options: ["false", "true"]
        description: ""
      GENERATE_EFFECTIVE_SET:
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
        description: ""
      GET_PASSPORT:
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
        description: ""
      CMDB_IMPORT:
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
        description: ""
      GH_ADDITIONAL_PARAMS:
        required: false
        default: ""
        type: string
        description: ""

# Serialize runs targeting the same environments: generation jobs commit to the repo.
concurrency:
  group: "envgene-v2-${{ github.ref }}-${{ inputs.ENV_NAMES }}"
  cancel-in-progress: false

env:
  #CONFIGURATION
  # Non-secret values only. Workflow level env reaches every job automatically,
  # so secrets belong in the job that needs them, never in the shared artifact.
  GITHUB_USER_EMAIL: opensourcegroup@netcracker.com
  GITHUB_USER_NAME: envgene
  SECRET_POSTFIX: custom_secret
  CI_COMMIT_REF_NAME: ${{ github.ref_name }}
  CI_PROJECT_DIR: /workspace
  INSTANCES_DIR: /workspace/environments
  DOCKER_CLOUD_REGISTRY_PROVIDER: ${{ vars.DOCKER_CLOUD_REGISTRY_PROVIDER || '' }}

  #DOCKER_IMAGE_NAMES
  DOCKER_IMAGE_NAME_ENVGENE: "${{ vars.DOCKER_REGISTRY || 'ghcr.io/netcracker' }}/qubership-envgene"
  DOCKER_IMAGE_NAME_EFFECTIVE_SET_GENERATOR: "${{ vars.DOCKER_REGISTRY || 'ghcr.io/netcracker' }}/qubership-effective-set-generator"

  #DOCKER_IMAGE_TAGS
  DOCKER_IMAGE_TAG_ENVGENE: "feature-modern-toolset"
  DOCKER_IMAGE_TAG_EFFECTIVE_SET_GENERATOR: "feature-modern-toolset"

defaults:
  run:
    shell: bash

jobs:
  process_environment_variables:
    name: "Input Parameters Processing"
    runs-on: ${{ vars.GH_RUNNER_TAG_NAME || 'ubuntu-22.04' }}
    timeout-minutes: ${{ fromJSON(vars.GH_RUNNER_SCRIPT_TIMEOUT || '10') }}
    outputs:
      ENV_NAMES: ${{ env.ENV_NAMES }}
      BG_MANAGE: ${{ env.BG_MANAGE }}
      ENV_INVENTORY_CONTENT: ${{ env.ENV_INVENTORY_CONTENT }}
      CRED_ROTATION_PAYLOAD: ${{ env.CRED_ROTATION_PAYLOAD }}
      ENV_BUILDER: ${{ env.ENV_BUILDER }}
      GENERATE_EFFECTIVE_SET: ${{ env.GENERATE_EFFECTIVE_SET }}
      ENV_INVENTORY_INIT: ${{ env.ENV_INVENTORY_INIT }}
      ENV_SPECIFIC_PARAMS: ${{ env.ENV_SPECIFIC_PARAMS }}
      ENV_TEMPLATE_NAME: ${{ env.ENV_TEMPLATE_NAME }}
      SD_SOURCE_TYPE: ${{ env.SD_SOURCE_TYPE }}
      SD_DATA: ${{ env.SD_DATA }}
      SD_VERSION: ${{ env.SD_VERSION }}
      DOCKER_CLOUD_REGISTRY_PROVIDER: ${{ env.DOCKER_CLOUD_REGISTRY_PROVIDER }}
    steps:
      - name: Repository Checkout
        # Latest release still running on node20; v5+ needs runner >= 2.327.1 (node24)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Load environment variables from configuration files
        uses: ./.github/actions/load-env-files
        with:
          paths: |
            .github/pipeline_vars.env

      - name: Process Input Parameters
        env:
          DEPLOYMENT_TICKET_ID: ${{ inputs.DEPLOYMENT_TICKET_ID }}
          ENV_NAMES: ${{ inputs.ENV_NAMES }}
          ENV_BUILDER: ${{ inputs.ENV_BUILDER }}
          GENERATE_EFFECTIVE_SET: ${{ inputs.GENERATE_EFFECTIVE_SET }}
          GET_PASSPORT: ${{ inputs.GET_PASSPORT }}
          CMDB_IMPORT: ${{ inputs.CMDB_IMPORT }}
          ENV_TEMPLATE_VERSION: ${{ inputs.ENV_TEMPLATE_VERSION }}
          GH_ADDITIONAL_PARAMS: ${{ inputs.GH_ADDITIONAL_PARAMS }}
        run: |
          set -euo pipefail

          if [[ ! "$ENV_NAMES" =~ ^[A-Za-z0-9_./,\;[:space:]-]+$ ]]; then
            echo "::error::ENV_NAMES contains unsupported characters: $ENV_NAMES"
            exit 1
          fi

          for name in DEPLOYMENT_TICKET_ID ENV_NAMES ENV_BUILDER GENERATE_EFFECTIVE_SET \
                      GET_PASSPORT CMDB_IMPORT ENV_TEMPLATE_VERSION GH_ADDITIONAL_PARAMS; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done

      - name: Process additional variables
        run: |
          set -euo pipefail
          .github/scripts/process_additional_variables.sh

      - name: Create env_generation_params
        run: |
          set -euo pipefail
          .github/scripts/create_env_generation_params.sh

      - name: Show resolved variable names
        run: |
          set -euo pipefail
          echo "Variables available to downstream jobs:"
          cut -d= -f1 "$GITHUB_ENV" | grep -v '^$' | sort -u || true

      - name: Create .env file
        env:
          # Names matching this pattern never leave the job.
          DENY_PATTERN: '(SECRET|TOKEN|PASSWORD|PASSWD|CREDENTIAL|PRIVATE|_KEY$|^KEY$|^GITHUB_|^RUNNER_|^ACTIONS_|^INPUT_|^DENY_PATTERN$|^DENY_RUNTIME$)'
          # Re-injecting these into a later job would hijack that job's shell.
          DENY_RUNTIME: '^(PATH|HOME|PWD|OLDPWD|SHLVL|SHELL|IFS|USER|LOGNAME|HOSTNAME|TERM|TMPDIR|BASH_ENV|ENV|LD_PRELOAD|LD_LIBRARY_PATH|NODE_OPTIONS|_)$'
        run: |
          set -euo pipefail

          delimiter="EOF_$(openssl rand -hex 12)"
          : > "${{ github.workspace }}/.env"

          while IFS= read -r -d '' entry; do
            name="${entry%%=*}"
            value="${entry#*=}"

            if [[ "$name" =~ $DENY_PATTERN || "$name" =~ $DENY_RUNTIME ]]; then
              continue
            fi

            # Multi-line values (e.g. ENV_INVENTORY_CONTENT) need the heredoc form
            # so that consumers can append this file to $GITHUB_ENV as is.
            if [[ "$value" == *$'\n'* ]]; then
              printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "$value" "$delimiter"
            else
              printf '%s=%s\n' "$name" "$value"
            fi
          done < <(env -0) >> "${{ github.workspace }}/.env"

      - name: Upload .env as artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          include-hidden-files: true
          name: environment-file
          path: .env
          retention-days: 1

  envgene_execution:
    name: "EnvGene - ${{ inputs.ENV_NAMES }}"
    runs-on: ${{ vars.GH_RUNNER_TAG_NAME || 'ubuntu-22.04' }}
    timeout-minutes: ${{ fromJSON(vars.GH_RUNNER_SCRIPT_TIMEOUT || '10') }}
    permissions:
      contents: write
    needs:
      - process_environment_variables
    steps:
      - name: Repository Checkout
        uses: actions/checkout@v4.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      ### ENV VARS PROCESSING - START ###
      - name: Download environment-file
        uses: actions/download-artifact@v4
        with:
          name: environment-file

      - name: Prepare environment
        run: |
          while IFS= read -r line; do
            if [[ -n "$line" && ! "$line" =~ ^# ]]; then
              echo "$line" >> "$GITHUB_ENV"
            fi
          done < ./.env

          PACKAGE_NAME="generate_pipeline_$(date -u +%Y%m%d_%H%M%S)"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"

        shell: bash

      - name: Create env file for container
        run: env > .env.container

      - name: Authenticate to GAR (Google Artifact Registry)
        if: needs.process_environment_variables.outputs.DOCKER_CLOUD_REGISTRY_PROVIDER == 'GCP'
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}
      ### ENV VARS PROCESSING - END ###

      ### ENVGENE_EXECUTION - START ###
      - name: ENVGENE_EXECUTION
        run: |
          docker run --rm -v ${{ github.workspace }}:${{ env.CI_PROJECT_DIR }} -w ${{ env.CI_PROJECT_DIR }} -e GITHUB_TOKEN=${{ secrets.GH_ACCESS_TOKEN }} -e COMMIT_ENV=true --env-file .env.container --user root -e HOME=/root \
            ${{ env.DOCKER_IMAGE_NAME_ENVGENE }}:${{ env.DOCKER_IMAGE_TAG_ENVGENE }} \
            bash -c "
              set -eo pipefail
              source /module/venv/bin/activate
              echo 'Executing ENVGENE...'
              /module/scripts/utils/handle_certs.sh
              git config --global --add safe.directory \"\${CI_PROJECT_DIR}\"
              # actions/checkout already adds origin; sparse_checkout.py expects a clean repo (GitLab-style).
              git -C \"\${CI_PROJECT_DIR}\" remote remove origin 2>/dev/null || true
              python3 /module/scripts/utils/sparse_checkout.py
              if [[ -f \"\${HOME}/.bashrc\" ]]; then
                source \"\${HOME}/.bashrc\"
              fi
              python3 /module/scripts/pipeline/orchestrator.py
              set -a && . envgene-vars.env && set +a

              if [ \"\$PIPELINE_TYPE\" = \"GITLAB_DEPLOY\" ]; then
                if [ \"\$OPERATION_TYPE\" != \"CLEAN\" ]; then
                  python3 /python/argocd-dpg/src/argo/main.py generate structure \
                    -p params.environment_id=\"\$FULL_ENV_NAME\" \
                    -p params.deployment_plan=\"\$CI_PROJECT_DIR/environments/\$CLUSTER_NAME/\$ENVIRONMENT_NAME/Inventory/deploy-plan.yml\"
                  [[ -v ENVGENE_AGE_PUBLIC_KEY ]] && sops --encrypt -i --age \$ENVGENE_AGE_PUBLIC_KEY ARGO_DPG_CONTEXT.env \
                    || echo \"Skipping argo-dpg context encryption because ENVGENE_AGE_PUBLIC_KEY is not defined\"
                fi
                [[ \"\$OPERATION_TYPE\" = \"CLEAN\" ]] && export ESPUSHER_OVERWRITE=\"true\" || export ESPUSHER_OVERWRITE=\"false\"
                python3 /python/es-pusher/src/espusher/main.py push \
                  -p params.environment_id=\"\$FULL_ENV_NAME\" \
                  -p params.commit_message=\"DEVOPS-001 Push effective set for \\\"\$FULL_ENV_NAME\\\"\" \
                  -p params.overwrite=\"\$ESPUSHER_OVERWRITE\"
              fi
              if [[ \"\$PIPELINE_TYPE\" != \"GITLAB_DEPLOY\" && \"\$CMDB_IMPORT\" = \"true\" ]]; then
                /module/scripts/cmdb_import/cmdb_import.sh
              fi
            "

      - name: ENVGENE_EXECUTION - Upload Build Env Package
        uses: actions/upload-artifact@v4
        if: needs.process_environment_variables.outputs.ENV_BUILDER == 'true'
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            environments/
            configuration/
            sboms/
            templates/
            tmp/
            ARGO_DPG_CONTEXT.env
          include-hidden-files: true
      ### ENVGENE_EXECUTION - END ###