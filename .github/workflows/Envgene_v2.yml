name: "[IN DEV] EnvGene Execution v2"

run-name: "EnvGene Execution - ${{ inputs.ENV_NAMES }}"

permissions:
  contents: read
  packages: read

on:
  workflow_dispatch:
    inputs:
      ENV_NAMES:
        required: true
        type: string
        description: ""
      DEPLOYMENT_TICKET_ID:
        required: false
        default: ""
        type: string
        description: ""
      ENV_TEMPLATE_VERSION:
        required: false
        default: ""
        type: string
        description: ""
      ENV_BUILDER:
        required: true
        default: "true"
        type: string
        description: ""
      GENERATE_EFFECTIVE_SET:
        required: true
        default: "false"
        type: string
        description: ""
      GET_PASSPORT:
        required: true
        default: "false"
        type: string
        description: ""
      CMDB_IMPORT:
        required: true
        default: "false"
        type: string
        description: ""
      GH_ADDITIONAL_PARAMS:
        required: false
        default: ""
        type: string
        description: ""

concurrency:
  group: "envgene-${{ github.ref }}-${{ inputs.ENV_NAMES }}"
  cancel-in-progress: false

env:
  #CONFIGURATION
  GITHUB_USER_EMAIL: opensourcegroup@netcracker.com
  GITHUB_USER_NAME: envgene
  SECRET_POSTFIX: custom_secret
  DOCKER_CLOUD_REGISTRY_PROVIDER: ${{ vars.DOCKER_CLOUD_REGISTRY_PROVIDER || '' }}

  #DOCKER_IMAGE_NAMES
  DOCKER_IMAGE_NAME_ENVGENE: "${{ vars.DOCKER_REGISTRY || 'ghcr.io/netcracker' }}/qubership-envgene"
  DOCKER_IMAGE_NAME_EFFECTIVE_SET_GENERATOR: "${{ vars.DOCKER_REGISTRY || 'ghcr.io/netcracker' }}/qubership-effective-set-generator"

  #DOCKER_IMAGE_TAGS
  DOCKER_IMAGE_TAG_ENVGENE: "feature-modern-toolset"
  DOCKER_IMAGE_TAG_EFFECTIVE_SET_GENERATOR: "feature-modern-toolset"

  # GitLab-compatible paths for scripts inside the EnvGene image
  CI_PROJECT_DIR: ${{ github.workspace }}
  INSTANCES_DIR: ${{ github.workspace }}/environments
  CI_COMMIT_REF_NAME: ${{ github.ref_name }}
  HOME: /root
  COMMIT_ENV: "true"

defaults:
  run:
    shell: bash

jobs:
  process_environment_variables:
    name: "EnvGene Execution"
    runs-on: ${{ vars.GH_RUNNER_TAG_NAME || 'ubuntu-22.04' }}
    timeout-minutes: ${{ fromJSON(vars.GH_RUNNER_SCRIPT_TIMEOUT || '10') }}
    container:
      image: ${{ env.DOCKER_IMAGE_NAME_ENVGENE }}:${{ env.DOCKER_IMAGE_TAG_ENVGENE }}
      options: --user root
      credentials:
        username: ${{ vars.DOCKER_CLOUD_REGISTRY_PROVIDER == 'GCP' && '_json_key' || github.actor }}
        password: ${{ vars.DOCKER_CLOUD_REGISTRY_PROVIDER == 'GCP' && secrets.GCP_SA_KEY || github.token }}
    env:
      GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ENVGENE_AGE_PUBLIC_KEY: ${{ secrets.ENVGENE_AGE_PUBLIC_KEY }}
      ENVGENE_AGE_PRIVATE_KEY: ${{ secrets.ENVGENE_AGE_PRIVATE_KEY }}
    steps:
      - name: Repository Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Load environment variables from configuration files
        uses: ./.github/actions/load-env-files
        with:
          paths: |
            .github/pipeline_vars.env

      - name: Process Input Parameters
        env:
          WORKFLOW_INPUTS: ${{ toJSON(github.event.inputs) }}
        run: |
          set -euo pipefail
          .github/scripts/process_variables.sh

      - name: EnvGene Execution
        run: .github/scripts/envgene_execute.sh

      - name: Upload generated environment package
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            environments/
            configuration/
            sboms/
            templates/
            tmp/
            ARGO_DPG_CONTEXT.env
          include-hidden-files: true
